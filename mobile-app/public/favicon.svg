<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#131a2a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>

  <!-- Subtle Chart Grid Line Accents -->
  <path d="M 96 360 L 416 360" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <path d="M 96 280 L 416 280" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  <path d="M 96 200 L 416 200" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Dynamic Trajectory Trendline Glow -->
  <path d="M 112 340 Q 200 320 250 250 T 400 130" fill="none" stroke="url(#glowGrad)" stroke-width="18" stroke-linecap="round" opacity="0.3" filter="url(#glow)" />
  <path d="M 112 340 Q 200 320 250 250 T 400 130" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Node Dots along trend -->
  <circle cx="112" cy="340" r="10" fill="#38bdf8" />
  <circle cx="230" cy="270" r="10" fill="#3b82f6" />
  <circle cx="320" cy="190" r="10" fill="#8b5cf6" />
  <circle cx="400" cy="130" r="14" fill="#10b981" filter="url(#glow)" />

  <!-- Shield / Wealth Crest Icon Accent in Bottom Corner -->
  <path d="M 190 380 L 256 420 L 322 380 L 322 320 Q 322 280 256 260 Q 190 280 190 320 Z" fill="rgba(59, 130, 246, 0.15)" stroke="url(#primaryGrad)" stroke-width="4" />
  <path d="M 235 340 L 252 357 L 277 325" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

services:
  - type: web
    name: investment-tracker-backend
    env: python
    region: oregon
    plan: free
    rootDir: investment-tracker/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENV
        value: production
